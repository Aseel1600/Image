<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAXE • كوليكشن قوالب CapCut</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080f;--vio:#8b5cf6;--cyan:#22d3ee;--pink:#ff3d9a;--gold:#ffb648;--txt:#eaf0ff;--dim:#8c99bd;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Tajawal",sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--vio);border-radius:10px}
.bgfx{position:fixed;inset:0;z-index:-3;overflow:hidden}
.blb{position:absolute;border-radius:50%;filter:blur(120px);opacity:.4}
.b1{width:60vw;height:60vw;background:#7c3aed;top:-20vw;right:-10vw}
.b2{width:50vw;height:50vw;background:#0891b2;bottom:-20vw;left:-10vw}
.gridfx{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:50px 50px}
.top{position:sticky;top:0;z-index:60;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 18px;backdrop-filter:blur(20px);background:rgba(8,10,20,.85);border-bottom:1px solid var(--line)}
.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:Orbitron;font-weight:900;font-size:14px;background:linear-gradient(135deg,var(--vio),var(--cyan));color:#05070d}
.logo{display:flex;gap:10px;align-items:center}
.logo h1{margin:0;font-family:Orbitron;font-size:17px;background:linear-gradient(90deg,#fff,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:2px 0 0;font-size:11px;color:var(--dim)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);padding:9px 14px;border-radius:12px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
.btn.primary{background:linear-gradient(135deg,var(--vio),var(--cyan));border:none;color:#000}
.btn.pink{background:linear-gradient(135deg,var(--pink),var(--gold));border:none;color:#000}
.btn.green{background:linear-gradient(135deg,#10b981,#22c55e);border:none;color:#000}
.btn.sm{padding:6px 10px;font-size:11.5px;border-radius:9px}
.btn.dgr:hover{background:rgba(239,68,68,.2);color:#fca5a5}
.inp,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--txt);font-family:inherit;font-size:13.5px}
.inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--vio)}
select{width:auto}
.wrap{max-width:1560px;margin:auto;padding:14px;display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(15px)}
aside{padding:14px;max-height:calc(100vh - 100px);overflow:auto}
.sh{font-size:11px;color:var(--dim);font-weight:800;letter-spacing:1px;margin-bottom:8px}
.tree{font-size:13px;margin-top:8px}
.tr{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;cursor:pointer}
.tr.on{background:rgba(139,92,246,.25);box-shadow:inset 0 0 0 1px var(--vio)}
.car{width:14px;text-align:center;color:var(--dim);font-size:10px}
.car.hid{visibility:hidden}
.tic{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--vio),var(--cyan));flex:none}
.tic.tpl{background:linear-gradient(135deg,var(--pink),var(--gold))}
.tnm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cnt{font-size:10px;color:var(--dim);background:rgba(255,255,255,.05);padding:2px 6px;border-radius:20px}
.tk{margin-inline-start:12px;padding-inline-start:8px;border-inline-start:1px dashed rgba(255,255,255,.1)}
.bar{padding:12px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);padding:0 4px 10px}
.cr{cursor:pointer;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.04)}
.cr.last{background:var(--vio);color:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.st{flex:1;min-width:110px;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.st b{display:block;font-size:20px;font-family:Orbitron}
.st span{font-size:10px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{position:relative;padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--line);transition:.2s;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.2)}
.card:after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--vio),var(--cyan))}
.card.tpl:after{background:linear-gradient(90deg,var(--pink),var(--gold))}
.ch{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.cic{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--vio),var(--cyan));flex:none}
.cic.t{background:linear-gradient(135deg,var(--pink),var(--gold))}
.ch h3{margin:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ch small{color:var(--dim);font-size:11px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:10px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.05);color:#c8d2ee}
.lnk{display:block;font-size:11px;color:var(--cyan);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px;direction:ltr;text-align:left}
.acts{display:flex;gap:4px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.empty{grid-column:1/-1;padding:40px 10px;text-align:center;color:var(--dim)}
.ov{position:fixed;inset:0;z-index:200;background:rgba(3,5,12,.8);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:12px}
.ov.on{display:flex}
.modal{width:min(1000px,100%);max-height:94vh;overflow:auto;border-radius:22px;background:#0d101f;border:1px solid var(--line)}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;position:sticky;top:0;background:#0d101f;z-index:3}
.mh h2{margin:0;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{padding:16px;display:grid;grid-template-columns:1fr 300px;gap:16px}
.flds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:10px;color:var(--cyan);font-family:Orbitron;font-weight:700}
.f label i{color:var(--dim);font-family:inherit;font-style:normal;font-size:10.5px}
.f textarea{min-height:100px;line-height:1.6;font-family:monospace,monospace}
.pv{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#05070d;aspect-ratio:1}
.pv canvas{width:100%;height:100%;display:block}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:#0d101f}
.pbox{width:min(440px,100%);border-radius:18px;background:#11152b;border:1px solid var(--line);padding:18px}
.pbox h3{margin:0 0 6px;font-size:16px}
.pbox p{margin:0 0 12px;font-size:12.5px;color:var(--dim);line-height:1.6}
.pbox .inp,.pbox select,.pbox textarea{margin-bottom:12px}
.row{display:flex;gap:8px}
.toasts{position:fixed;bottom:12px;left:12px;z-index:400;display:flex;flex-direction:column;gap:6px;max-width:320px}
.toast{padding:10px 14px;border-radius:10px;background:rgba(18,22,40,.95);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.toast.ok{border-inline-start:3px solid #22c55e}.toast.err{border-inline-start:3px solid #ef4444}
.loader{position:fixed;inset:0;z-index:500;background:rgba(4,6,14,.85);backdrop-filter:blur(5px);display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center}
.loader.on{display:flex}
.ring{width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:var(--cyan);border-right-color:var(--vio);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mob{display:none}
@media(max-width:900px){
 .wrap{grid-template-columns:1fr;padding:10px}
 aside{position:fixed;inset:0 auto 0 0;width:270px;z-index:120;transform:translateX(-102%);transition:.3s}
 aside.on{transform:none}
 .mob{display:inline-flex}.mb{grid-template-columns:1fr}.flds{grid-template-columns:1fr}
}
</style>
</head>

<div class="bgfx"><div class="blb b1"></div><div class="blb b2"></div></div>
<div class="gridfx"></div>

<header class="top">
  <button class="btn sm mob" data-act="menu">☰</button>
  <div class="logo"><div class="mark">RAXE</div><div><h1>RAXE • CAPCUT</h1><p>7 كوليكشنات • 70 قالب معتمد ✅</p></div></div>
  <div class="grow"></div>
  <select id="quality"><option value="1.5">جودة 1.5x</option><option value="2.5" selected>جودة 2.5x</option><option value="3.5">جودة 3.5x</option></select>
  <button class="btn sm" data-act="backup">⭳ نسخة</button>
  <button class="btn sm" data-act="restore">⭱ استيراد</button>
  <input type="file" id="fileImp" accept=".json" hidden>
</header>

<div class="wrap">
  <aside id="side" class="panel">
    <div class="sh">شجرة الكوليكشن</div>
    <input id="q" class="inp" placeholder="🔍 بحث...">
    <div id="tree" class="tree"></div>
  </aside>
  <main>
    <div class="panel bar">
      <button class="btn primary" data-act="newcol">📁 كوليكشن جديد</button>
      <button class="btn pink" data-act="newtpl">🎬 قالب جديد</button>
      <div class="grow"></div>
      <button class="btn sm" data-act="colpng">🖼 حفظ الكوليكشن PNG</button>
      <button class="btn sm" data-act="colhtml">🔗 تفاعلي</button>
      <button class="btn sm dgr" data-act="factory">♻️ استعادة البيانات الأصلية</button>
    </div>
    <div id="crumbs" class="crumbs"></div>
    <div id="stats" class="stats"></div>
    <div id="grid" class="grid"></div>
  </main>
</div>

<div class="ov" id="edov"><div class="modal">
  <div class="mh"><h2 id="edt">تعديل القالب</h2><button class="btn sm green" data-act="edcopy">📋 نسخ</button><button class="btn sm" data-act="edclose">✕</button></div>
  <div class="mb">
    <div class="flds">
      <div class="f full"><label>TEMPLATE NAME <i>— اسم القالب</i></label><input id="fName" class="inp"></div>
      <div class="f"><label>TEMPLATE ID</label><input id="fId" class="inp" dir="ltr"></div>
      <div class="f"><label>TYPE <i>— النوع</i></label><input id="fType" class="inp"></div>
      <div class="f full"><label>TEMPLATE LINK <i>— الرابط</i></label><input id="fLink" class="inp" dir="ltr"></div>
      <div class="f"><label>DURATION <i>— المدة</i></label><input id="fDur" class="inp"></div>
      <div class="f"><label>NUMBER OF CLIPS <i>— عدد المقاطع</i></label><input id="fClips" class="inp"></div>
      <div class="f full"><label>CLIP TIMINGS <i>— توقيتات المقاطع</i></label><textarea id="fTim" class="inp"></textarea></div>
      <div class="f full"><label>NOTES <i>— ملاحظات</i></label><textarea id="fNotes" class="inp"></textarea></div>
    </div>
    <div>
      <div class="sh">معاينة حية 1:1</div>
      <div class="pv"><canvas id="prev"></canvas></div>
    </div>
  </div>
  <div class="mf">
    <button class="btn primary" data-act="edsave">💾 حفظ</button>
    <button class="btn pink" data-act="edpng">🖼 PNG 1:1</button>
    <div class="grow"></div>
    <button class="btn dgr" data-act="eddel">🗑 حذف</button>
  </div>
</div></div>

<div class="ov" id="pov"><div class="pbox" id="pbox"></div></div>
<div class="toasts" id="toasts"></div>
<div class="loader" id="loader"><div class="ring"></div><p id="ltxt">جاري العمل...</p></div>

/* ═══════════ HELPERS ═══════════ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function normUrl(u){u=(u||'').trim();if(!u)return '';if(/^[a-zA-Z][a-zA-Z0-9+.\-]*:/.test(u))return u;return 'https://'+u;}
function safeName(s){return String(s||'RAXE').replace(/[\\/:*?"<>|\n\r]+/g,'-').trim().slice(0,40)||'RAXE';}

function toast(m,k){
  var d=document.createElement('div');d.className='toast '+(k||'inf');d.textContent=m;
  $('toasts').appendChild(d);
  setTimeout(function(){d.style.opacity=0;setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},300);},2600);
}
window.addEventListener('error',function(e){toast('خطأ: '+e.message,'err');});
function showLoad(t){$('ltxt').textContent=t||'جاري العمل...';$('loader').classList.add('on');}
function hideLoad(){$('loader').classList.remove('on');}

var DB=null, CUR='root', EDIT=null, FILTER='';

function buildSeed(){
  var root={id:'root',type:'col',name:'كوليكشن قوالب RAXE',open:true,children:[]};
  var order=['V1','V2','V3','V4','V5','V6','V7'];
  for(var i=0;i<order.length;i++){
    var k=order[i];
    var col={id:'col_'+k,type:'col',name:'📁 '+k,open:false,created:Date.now(),children:[]};
    for(var j=0;j<SEED[k].length;j++){
      var t=SEED[k][j];
      col.children.push({
        id:'tpl_'+k+'_'+(j+1),type:'tpl',name:t[0],created:Date.now()-j*1000,
        data:{tid:t[1],link:'https://www.capcut.com/tv2/'+t[1]+'/',ttype:'CapCut Template',duration:t[2],clips:t[3],timings:t[4],notes:''}
      });
    }
    root.children.push(col);
  }
  return root;
}
function loadDB(){try{var r=localStorage.getItem('raxe_v6');if(r){var d=JSON.parse(r);if(d&&d.id)return d;}}catch(e){}return null;}
function saveDB(){try{localStorage.setItem('raxe_v6',JSON.stringify(DB));}catch(e){}}
function findNode(id,n){n=n||DB;if(n.id===id)return n;var c=n.children||[];for(var i=0;i<c.length;i++){var r=findNode(id,c[i]);if(r)return r;}return null;}
function findParent(id,n){n=n||DB;var c=n.children||[];for(var i=0;i<c.length;i++){if(c[i].id===id)return n;var r=findParent(id,c[i]);if(r)return r;}return null;}
function pathTo(id){var out=[],n=findNode(id);while(n){out.unshift(n);n=findParent(n.id);}return out;}
function stats(n){var c=0,t=0,ch=n.children||[];for(var i=0;i<ch.length;i++){if(ch[i].type==='col'){c++;var s=stats(ch[i]);c+=s.c;t+=s.t;}else t++;}return {c:c,t:t};}
function sortKids(n){return (n.children||[]).slice();}

function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast('تم النسخ ✅','ok');},function(){fallbackCopy(txt);});
  }else fallbackCopy(txt);
}
function fallbackCopy(txt){
  try{
    var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.top='-1000px';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    toast('تم النسخ ✅','ok');
  }catch(e){toast('تعذّر النسخ','err');}
}

/* ═══════════ RENDER ═══════════ */
function renderAll(){renderTree();renderCrumbs();renderStats();renderGrid();saveDB();}
function renderTree(){
  var q=FILTER.toLowerCase();
  function match(n){
    if(!q)return true;
    if((n.name||'').toLowerCase().indexOf(q)>=0)return true;
    if(n.data&&((n.data.tid||'')+(n.data.link||'')).toLowerCase().indexOf(q)>=0)return true;
    var c=n.children||[];for(var i=0;i<c.length;i++)if(match(c[i]))return true;
    return false;
  }
  function draw(n){
    if(!match(n))return '';
    var ch=sortKids(n),has=ch.length>0,open=(n.open||!!q);
    var h='<div><div class="tr'+(CUR===n.id?' on':'')+'" data-act="tnode" data-id="'+n.id+'">';
    h+='<span class="car'+(has?'':' hid')+'" data-act="toggle" data-id="'+n.id+'">'+(open?'▾':'◂')+'</span>';
    h+='<span class="tic '+(n.type==='tpl'?'tpl':'')+'"></span>';
    h+='<span class="tnm">'+esc(n.name)+'</span>';
    if(n.type==='col'&&has)h+='<span class="cnt">'+ch.length+'</span>';
    h+='</div>';
    if(has&&open){h+='<div class="tk">';for(var i=0;i<ch.length;i++)h+=draw(ch[i]);h+='</div>';}
    return h+'</div>';
  }
  $('tree').innerHTML=draw(DB);
}
function renderCrumbs(){
  var p=pathTo(CUR),h='';
  for(var i=0;i<p.length;i++){
    h+='<span class="cr'+(i===p.length-1?' last':'')+'" data-act="goto" data-id="'+p[i].id+'">'+esc(p[i].name)+'</span>';
    if(i<p.length-1)h+=' <span>/</span> ';
  }
  $('crumbs').innerHTML=h;
}
function renderStats(){
  var n=findNode(CUR)||DB,s=stats(n),ch=n.children||[],dc=0,dt=0;
  for(var i=0;i<ch.length;i++)if(ch[i].type==='col')dc++;else dt++;
  $('stats').innerHTML='<div class="st"><b>'+dc+'</b><span>مجلدات</span></div><div class="st"><b>'+dt+'</b><span>قوالب مباشرة</span></div><div class="st"><b>'+s.t+'</b><span>إجمالي القوالب</span></div>';
}

        (L?'<a class="lnk" href="'+esc(L)+'" target="_blank" data-act="noop">🔗 '+esc(L)+'</a>':'')+

    }

/* ═══════════ DIALOG ═══════════ */
function ask(o){
  return new Promise(function(res){
    var h='<h3>'+esc(o.title)+'</h3>';
    if(o.msg)h+='<p>'+esc(o.msg)+'</p>';
    if(o.input!==undefined)h+='<input id="pin" class="inp" value="'+esc(o.input)+'">';
    h+='<div class="row"><button class="btn primary grow" id="pok">'+esc(o.ok||'موافق')+'</button><button class="btn grow" id="pno">إلغاء</button></div>';
    $('pbox').innerHTML=h;$('pov').classList.add('on');
    var inp=$('pin');if(inp){inp.focus();inp.select();}
    function done(v){$('pov').classList.remove('on');res(v);}
    $('pok').onclick=function(){done(inp?inp.value:true);};
    $('pno').onclick=function(){done(null);};
    if(inp)inp.onkeydown=function(e){if(e.key==='Enter')done(inp.value);};
  });
}

/* ═══════════ QR CODE (Offline) ═══════════ */
var QRGen=(function(){
  var EXP=new Array(512),LOG=new Array(256);
  (function(){var x=1;for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11d;}for(var j=255;j<512;j++)EXP[j]=EXP[j-255];})();
  function mul(a,b){if(a===0||b===0)return 0;return EXP[LOG[a]+LOG[b]];}
  function genPoly(n){var g=[1];for(var i=0;i<n;i++){var ng=[];for(var k=0;k<=g.length;k++)ng.push(0);for(var j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i]);}g=ng;}return g;}
  function ecBytes(data,n){var g=genPoly(n),res=data.slice(0),i,j;for(i=0;i<n;i++)res.push(0);for(i=0;i<data.length;i++){var f=res[i];if(f!==0){for(j=0;j<g.length;j++)res[i+j]^=mul(g[j],f);}}return res.slice(data.length);}
  var RS=[null,{ec:7,g:[[1,19]]},{ec:10,g:[[1,34]]},{ec:15,g:[[1,55]]},{ec:20,g:[[1,80]]},{ec:26,g:[[1,108]]},{ec:18,g:[[2,68]]},{ec:20,g:[[2,78]]},{ec:24,g:[[2,97]]}];
  function totData(v){var s=0,g=RS[v].g;for(var i=0;i<g.length;i++)s+=g[i][0]*g[i][1];return s;}
  function make(text){
    var bytes=[],i,j,r,c;
    if(window.TextEncoder){var u=new TextEncoder().encode(text);for(i=0;i<u.length;i++)bytes.push(u[i]);}
    else{var s2=unescape(encodeURIComponent(text));for(i=0;i<s2.length;i++)bytes.push(s2.charCodeAt(i));}
    var v=0;for(i=1;i<=8;i++){if(bytes.length<=totData(i)-(i<8?2:3)){v=i;break;}}
    if(!v)v=8;
    var tot=totData(v),bits=[];
    function put(val,len){for(var k=len-1;k>=0;k--)bits.push((val>>k)&1);}
    put(4,4);put(bytes.length,v<10?8:16);
    for(i=0;i<bytes.length;i++)put(bytes[i],8);
    for(i=0;i<4&&bits.length<tot*8;i++)bits.push(0);
    while(bits.length%8)bits.push(0);
    var data=[];for(i=0;i<bits.length;i+=8){var b=0;for(j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}
    var pad=[236,17],pi=0;while(data.length<tot)data.push(pad[(pi++)%2]);

    case 'newcol':
      ask({title:'كوليكشن جديد',msg:'اسم الكوليكشن:',input:'كوليكشن جديد'}).then(function(v){
        if(v===null)return;findNode(CUR).children.push({id:uid(),type:'col',name:v.trim()||'كوليكشن',open:true,created:Date.now(),children:[]});renderAll();toast('تم ✨','ok');
      });break;
    case 'newtpl':
      var nn={id:uid(),type:'tpl',name:'قالب جديد',created:Date.now(),data:{tid:'',link:'',ttype:'CapCut Template',duration:'',clips:'',timings:'',notes:''}};
      findNode(CUR).children.push(nn);renderAll();openEditor(nn.id);break;
    case 'rename':ask({title:'إعادة تسمية',input:(findNode(id)||{}).name}).then(function(v){if(v){findNode(id).name=v;renderAll();}});break;
    case 'del':
      ask({title:'تأكيد الحذف',msg:'حذف هذا العنصر؟'}).then(function(ok){
        if(!ok||id==='root')return;var p=findParent(id);p.children=p.children.filter(function(x){return x.id!==id;});if(CUR===id)CUR=p.id;if(EDIT===id)closeEditor();renderAll();toast('تم الحذف','err');
      });break;
    case 'factory':
      ask({title:'استعادة البيانات الأصلية',msg:'سيتم مسح كل شيء وإعادة تحميل الـ 70 قالب. متأكد؟'}).then(function(ok){
        if(!ok)return;DB=buildSeed();CUR='root';renderAll();toast('تم استعادة الـ 70 قالب ✅','ok');
      });break;
    case 'colpng':
      showLoad('جاري إنشاء صورة الكوليكشن...');
      setTimeout(function(){try{var r=buildCollection(findNode(id||CUR),q(),4200);savePNG(r.canvas,'RAXE-'+safeName(findNode(id||CUR).name));toast('تم الحفظ ✅','ok');}catch(e){toast('خطأ: '+e.message,'err');}hideLoad();},80);
      break;
    case 'colhtml':
      showLoad('جاري إنشاء ملف تفاعلي...');
      setTimeout(function(){try{var r=buildCollection(findNode(id||CUR),1.8,2400);saveHTML(r.canvas,r.links,findNode(id||CUR).name,'RAXE-'+safeName(findNode(id||CUR).name));toast('تم الحفظ ✅','ok');}catch(e){toast('خطأ: '+e.message,'err');}hideLoad();},80);
      break;
    case 'tplpng':
      showLoad('جاري حفظ القالب...');
      setTimeout(function(){try{var r=buildTemplate(findNode(id),Math.round(1100*q()));savePNG(r.canvas,'RAXE-'+safeName(findNode(id).name));toast('تم الحفظ ✅','ok');}catch(e){toast('خطأ','err');}hideLoad();},60);
      break;
    case 'edsave':saveEditor();break;
    case 'edclose':closeEditor();break;
    case 'eddel':
      ask({title:'حذف',msg:'حذف هذا القالب؟'}).then(function(ok){
        if(!ok)return;var p=findParent(EDIT);p.children=p.children.filter(function(x){return x.id!==EDIT;});closeEditor();renderAll();toast('تم الحذف','err');
      });break;
    case 'edpng':saveEditor(true);showLoad('...');setTimeout(function(){var r=buildTemplate(findNode(EDIT),Math.round(1100*q()));savePNG(r.canvas,'RAXE-'+safeName(findNode(EDIT).name));hideLoad();toast('تم ✅','ok');},60);break;
    case 'backup':dl(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),'RAXE-backup.json');toast('تم تنزيل النسخة ✅','ok');break;
    case 'restore':$('fileImp').click();break;
  }
});
$('fileImp').onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(d&&d.id){DB=d;CUR='root';renderAll();toast('تم الاستيراد ✅','ok');}}catch(e){toast('ملف غير صالح','err');}};rd.readAsText(f);this.value='';};
$('q').oninput=function(){FILTER=this.value||'';renderTree();};
$('pov').onclick=function(e){if(e.target===this)this.classList.remove('on');};
$('edov').onclick=function(e){if(e.target===this)closeEditor();};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeEditor();$('pov').classList.remove('on');}});

/* ═══════════ BOOT ═══════════ */
DB=loadDB();
if(!DB){DB=buildSeed();}
renderAll();
})();
</script>
</body>
</html>
