    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }
    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      border-left: 1px solid #2a2a2a;
      background: #181818;
      padding: 20px;
      overflow-y: auto;
    }
    .sidebar h2 {
      margin-top: 0;
      font-size: 22px;
    }
    .character-btn {
      width: 100%;
      text-align: right;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #222;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
    }
    .character-btn:hover { background: #2c2c2c; }
    .character-btn.active {
      background: #3a2cff;
      border-color: #3a2cff;
    }
    .main {
      padding: 24px;
      overflow-y: auto;
    }
    .header-box {
      background: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .header-box h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .muted {
      color: #bbb;
      font-size: 14px;
    }
    .moment-card {
      background: #181818;
      border: 1px solid #2d2d2d;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .moment-title {
      margin: 0 0 12px;
      font-size: 20px;
      color: #fff;
    }
    .label {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .code-box, textarea {
      width: 100%;
      background: #0f0f0f;
      color: #d8f7d8;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      line-height: 1.6;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    textarea {
      min-height: 180px;
      resize: vertical;
      direction: ltr;
      text-align: left;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    button.action {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }
    .copy-compact { background: #444; }
    .copy-mini { background: #0b6bcb; }
    .copy-full { background: #13a34a; }
    details {
      margin-top: 10px;
    }
    summary {
      cursor: pointer;
      color: #ddd;
      margin-bottom: 10px;
    }
    .toast {
      position: fixed;
      left: 20px;
      bottom: 20px;
      background: #13a34a;
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      z-index: 9999;
    }
    .toast.show {
      opacity: 1;
    }
    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        border-left: 0;
        border-bottom: 1px solid #2a2a2a;
      }
    }
  </style>

The design brief I provide will contain all creative information about the artwork.

Do NOT change the concept.

Do NOT invent a different idea.

Do NOT ignore any instructions from the design brief.

Instead, execute the brief at the highest professional level while making intelligent design decisions that improve composition, readability, balance, and print quality.

The artwork is NOT an illustration. It is a single die-cut print shape engineered for one-click background removal.

##################################################
INPUT
##################################################

I will provide a complete and detailed design brief describing:

• Concept
• Character(s)
• Composition
• Typography
• Mood
• Graphic effects
• Lighting

##################################################

The artwork is intended exclusively for premium apparel printing.

• DTG
• DTF
• Screen Printing
• Print-on-Demand

The artwork must be commercially ready without requiring redesign.

##################################################
CANVAS
##################################################

Aspect Ratio:

2:3 Portrait (Vertical)

Canvas Size:

7000 × 10500 pixels

Requirements:

• Strict vertical orientation.
• Never generate a square image.
• Never generate a landscape image.
• Fill the canvas naturally.
• Balanced margins.
• Strong vertical visual flow.
• Designed specifically for a Large Back T-shirt print.

##################################################
BLACK T-SHIRT OPTIMIZATION
##################################################

The artwork will be printed on a BLACK T-shirt.

Design accordingly.

Requirements:

• Optimize all colors for black fabric.
• Use strong contrast.
• Ensure excellent visibility.
• Avoid dark elements disappearing into the shirt.

##################################################
BACKGROUND
##################################################

Generate the artwork on a PERFECT SOLID CHROMA KEY GREEN BACKGROUND.

RGB (0,255,0)

HEX #00FF00

• Perfectly flat color.

• Sharp.
• No gaps.
• No feathering.
• No fading.
• No transparency.

The border must follow the exact outer silhouette of the artwork.

The border exists to maximize automatic background removal quality.

##################################################
SINGLE DIE-CUT GRAPHIC (ABSOLUTE PRIORITY)
##################################################

The entire artwork MUST behave as ONE SINGLE SOLID DIE-CUT SHAPE.

Imagine the final artwork being cut from ONE continuous sheet.

Everything must belong to one connected mass.

Requirements:

• The artwork must have exactly ONE outer silhouette.
• The silhouette must be completely closed.
• The silhouette must be continuous from top to bottom.
• There must be NO disconnected pieces anywhere.
• There must be NO floating elements.
• There must be NO isolated typography.
• There must be NO detached smoke.
• There must be NO detached particles.
• There must be NO detached lighting.
• There must be NO detached debris.
• There must be NO detached paint strokes.
• There must be NO detached accessories.
• There must be NO detached decorative graphics.

Every visible pixel must connect directly or indirectly to the main body.

##################################################
SOLID INTERIOR (MANDATORY)
##################################################

Treat the artwork like one solid object.

Requirements:

• No transparent holes.
• No open gaps.
• No windows through the artwork.
• No cutout areas.
• No thin bridges that could separate during masking.
• No isolated internal islands.

If two elements are visually separated, they MUST be merged using:

• Clothing
• Smoke masses
• Energy masses
• Ink
• Paint
• Graphic textures
• Brush strokes
• Metal
• Rocks
• Clouds
• Abstract shapes

The connections should appear intentional and artistic.

##################################################
BACKGROUND REMOVAL SAFE DESIGN
##################################################

The artwork must survive automatic background removal perfectly.

A one-click AI background remover should detect ONLY ONE OBJECT.

After removing the background, the result must remain ONE COMPLETE GRAPHIC.

Nothing should become detached.

Nothing should disappear.

Nothing should require manual repair.

##################################################
NO FLOATING DETAILS
##################################################

Forbidden:

• Floating sparks
• Floating smoke
• Floating typography
• Floating symbols
• Floating energy
• Floating debris
• Floating dust
• Floating ornaments
• Floating paint splashes

Every decorative element must physically touch another element until the entire artwork forms ONE connected shape.

##################################################
PRINT SIMPLICITY
##################################################

Prioritize print quality over unnecessary complexity.

Requirements:

• Avoid excessive micro-details.
• Avoid extremely thin lines.
• Avoid tiny floating decorations.
• Avoid fragile details.
• Keep important shapes bold.
• Maintain excellent readability.

Luxury apparel should feel refined—not visually cluttered.

##################################################
PRINT QUALITY
##################################################

Commercial production quality.

Requirements:

• Ultra High Resolution.
• Razor-sharp details.
• Crisp edges.
• Professional color separation.
• High contrast.
• No blur.
• No compression.
• No pixelation.
• Print-ready quality.

##################################################
FINAL OUTPUT
##################################################

Generate ONLY one final raster image.

Do NOT create:

• Studio projects
• Canvas projects
• Editable files
• Mockups
• Documents
• Links
• Downloads
• Workspaces
• Presentations

Return ONLY the finished artwork.

No explanations.

No extra text.

Generate the final production-ready T-shirt graphic immediately.

##################################################
IMAGE GENERATION ONLY (HIGHEST PRIORITY)
##################################################

Generate the final result as ONE flat raster image only.

The output MUST be a finished image, NOT a project.

Absolutely DO NOT create:

• Design Studio
• Canvas
• Workspace
• Project

• Artboard

• Link

The response must contain ONLY the generated image itself.

The image must be fully rendered and ready to save immediately.

Do NOT provide any text.

Do NOT provide any explanation.

Do NOT provide any link.

Do NOT provide any project.

Do NOT provide any editable workspace.

Do NOT ask for confirmation.

Immediately generate the final artwork as a single static image.

The final deliverable is a raster image only.`;

          rank: index + 1,
          title: entry[0],
          compactInput: `${name} (${series}, ${entry[0]}), (anime), Designer's Choice, large back`,
          miniPrompt: entry[1]
        }))
      };
    }

    let activeCharacterId = data[0]?.id || null;

    function buildFullPrompt(miniPrompt) {
      return MASTER_PROMPT + "\n\n" + miniPrompt;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function fallbackCopy(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand("copy");
      document.body.removeChild(textarea);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          fallbackCopy(text);
        }
        showToast("تم النسخ بنجاح");
      } catch (error) {
        fallbackCopy(text);
        showToast("تم النسخ بنجاح");
      }
    }

    function renderCharacterList() {
      const container = document.getElementById("characterList");
      container.innerHTML = data.map(character => `
        <button class="character-btn ${character.id === activeCharacterId ? "active" : ""}" data-id="${character.id}">
          ${character.name}
          <div class="muted">${character.series} - ${character.moments.length} لحظات</div>
        </button>
      `).join("");

      container.querySelectorAll(".character-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCharacterId = btn.dataset.id;
          renderCharacterList();
          renderCharacterDetails();
        });
      });
    }

    function renderCharacterDetails() {
      const character = data.find(c => c.id === activeCharacterId);
      const container = document.getElementById("characterDetails");

      if (!character) {
        container.innerHTML = "<p>لا توجد شخصية محددة.</p>";
        return;
      }

      container.innerHTML = `
        <div class="header-box">
          <h1>${character.name}</h1>
          <div class="muted">السلسلة: ${character.series} | التصنيف: ${character.category} | مكان الطباعة: ${character.placement} | عدد اللحظات: ${character.moments.length}</div>
        </div>

        ${character.moments.map((moment, index) => {
          const fullPrompt = buildFullPrompt(moment.miniPrompt);
          return `
            <div class="moment-card">
              <h3 class="moment-title">#${moment.rank} - ${escapeHtml(moment.title)}</h3>

              <div class="label">Compact Input</div>
              <div class="code-box">${escapeHtml(moment.compactInput)}</div>

              <div class="btn-row">
                <button class="action copy-compact" data-index="${index}">نسخ Compact Input</button>
              </div>

              <div class="label">Mini Prompt</div>
              <div class="code-box">${escapeHtml(moment.miniPrompt)}</div>

              <div class="btn-row">
                <button class="action copy-mini" data-index="${index}">نسخ Mini Prompt</button>
                <button class="action copy-full" data-index="${index}">نسخ Full Prompt</button>
              </div>

              <details>
                <summary>عرض البروميت المتكامل</summary>
                <textarea readonly>${escapeHtml(fullPrompt)}</textarea>
              </details>
            </div>
          `;
        }).join("")}
      `;

      container.querySelectorAll(".copy-compact").forEach(btn => {
        btn.addEventListener("click", () => {
          const moment = character.moments[Number(btn.dataset.index)];
          copyText(moment.compactInput);
        });
      });

      container.querySelectorAll(".copy-mini").forEach(btn => {
        btn.addEventListener("click", () => {
          const moment = character.moments[Number(btn.dataset.index)];
          copyText(moment.miniPrompt);
        });
      });

      container.querySelectorAll(".copy-full").forEach(btn => {
        btn.addEventListener("click", () => {
          const moment = character.moments[Number(btn.dataset.index)];
          copyText(buildFullPrompt(moment.miniPrompt));
        });
      });
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderCharacterList();
    renderCharacterDetails();
  </script>
