    <!-- مكتبة JSZip لإنشاء ملفات الضغط داخل المتصفح -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #60a5fa;
            margin-top: 0;
            font-size: 1.4rem;
        }

        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-download {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #4ade80;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>منشئ مجلدات الشخصيات الـ 100</h2>
        <p>اضغط على الزر أدناه لتنزيل ملف ZIP يحتوي على الـ 100 مجلد بالترتيب الجديد والمطلوب مباشرة لجوالك.</p>
        
        <button class="btn-download" onclick="downloadZip()">تحميل الـ 100 مجلد (ZIP)</button>
        <div id="status" class="status">جاري إنشاء المجلدات وتحميلها...</div>

            "Shoto Todoroki (My Hero Academia)"
        ];

        function cleanFolderName(name) {
            return name.replace(/[\/:*?"<>|]/g, "").trim();
        }

        function downloadZip() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.innerText = 'جاري بناء المجلدات...';

            const zip = new JSZip();
            const mainFolder = zip.folder("مجلدات_الشخصيات_100");

            rawCharacters.forEach((char, index) => {
                // إضائة الترقيم التلقائي المسبوق برقم لترتيب الملفات بالترتيب
                const folderNumber = index + 1;
                const formattedName = `${folderNumber} ${cleanFolderName(char)}`;
                
                const subFolder = mainFolder.folder(formattedName);
                subFolder.file(".keep", "");
            });

            zip.generateAsync({ type: "blob" }).then(function (content) {
                statusDiv.innerText = 'تم التجميع، جاري التحميل...';
                
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "مجلدات_الشخصيات_100.zip";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                setTimeout(() => {
                    statusDiv.innerText = '✅ تم التحميل بنجاح! افتح مدير الملفات واعمل فك ضغط.';
                }, 1000);
            });
        }
    </script>
