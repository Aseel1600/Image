    }

    }
    .app {
      display: grid;

    }
    .sidebar {
      border-right: 1px solid #1e1e1e;

      padding: 12px;
      overflow-y: auto;
      max-height: calc(100vh - 80px);
      position: sticky;
      top: 80px;
    }

      margin-bottom: 8px;
      border: 1px solid #252525;

      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
      transition: 0.2s;
      font-size: 14px;
    }

    .char-btn.active {
      background: #3a2cff;

    }

      margin-top: 2px;
    }

    }

      background: #141414;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    }

      font-size: 14px;
    }

      padding: 20px;
      margin-bottom: 20px;
    }

      margin: 0 0 16px;
      font-size: 18px;
      color: #fff;
      border-bottom: 1px solid #252525;
      padding-bottom: 10px;
    }
    .field-group {
      margin-bottom: 16px;
    }
    .field-label {
      font-size: 12px;
      color: #13a34a;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .field-box {
      width: 100%;
      background: #0d0d0d;
      color: #e0e0e0;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chest-word {
      display: inline-block;
      background: #1a1a2e;
      border: 1px solid #3a2cff;
      color: #a89cff;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .copy-btn {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background: #333;
      font-size: 12px;
      margin-top: 8px;

    .copy-btn.green { background: #13a34a; }
    .copy-btn.green:hover { background: #0f8a3e; }
    .copy-btn.blue { background: #0b6bcb; }
    .copy-btn.blue:hover { background: #0958a8; }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #13a34a;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
      z-index: 9999;
      font-weight: bold;
    }

    .empty-msg {
      text-align: center;
      color: #555;
      padding: 60px 20px;
      font-size: 16px;
    }

      .app {

        position: relative;
        top: 0;
        max-height: 300px;
        border-right: 0;
        border-bottom: 1px solid #1e1e1e;
      }
    }

let activeId = null;
let filtered = [...data];

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
}

async function copy(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else fallbackCopy(text);
    toast("✅ Copied!");
  } catch { fallbackCopy(text); toast("✅ Copied!"); }
}

function esc(t) {
  return t.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  document.getElementById("resultsBar").textContent = `${filtered.length} characters found`;
  sb.innerHTML = filtered.map(c => `
    <button class="char-btn ${c.id===activeId?'active':''}" data-id="${c.id}">
      ${esc(c.name)}
      <div class="sub">${esc(c.series)} · ${c.cat} · ${c.moments.length} products</div>
    </button>
  `).join("");
  sb.querySelectorAll(".char-btn").forEach(b => {
    b.addEventListener("click", () => { activeId = b.dataset.id; renderSidebar(); renderMain(); });
  });
}

function renderMain() {
  const mp = document.getElementById("mainPanel");
  const ch = data.find(c => c.id === activeId);
  if (!ch) { mp.innerHTML = '<div class="empty-msg">Search and select a character to view products.</div>'; return; }

  mp.innerHTML = `
    <div class="header-box">
      <h2>${esc(ch.name)}</h2>
      <div class="sub">${esc(ch.series)} · ${ch.cat} · ${ch.moments.length} products</div>
    </div>
    ${ch.moments.map((m, idx) => {
      const fullDesc = m.descLead + "\n\n" + TSHIRT_SPECS;
      return `
      <div class="moment-card">
        <h3>#${m.rank} — ${esc(m.productName)}</h3>

        <div class="field-group">
          <div class="field-label">Product Name</div>
          <div class="field-box">${esc(m.productName)}</div>
          <div class="btn-row">
            <button class="copy-btn green" onclick="copy(\`${m.productName.replaceAll('`','\\`')}\`)">Copy Name</button>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label">Product Description</div>
          <div class="field-box">${esc(fullDesc)}</div>
          <div class="btn-row">
            <button class="copy-btn blue" onclick="copy(\`${fullDesc.replaceAll('`','\\`').replaceAll('\\','\\\\')}\`)">Copy Description</button>
          </div>
        </div>

        <div class="field-group">
          <div class="field-label">Left Chest Word</div>
          <div class="chest-word">${esc(m.chestWord)}</div>
          <div class="btn-row">
            <button class="copy-btn" onclick="copy('${m.chestWord}')">Copy Chest Word</button>
          </div>
        </div>
      </div>`;
    }).join("")}
  `;
}

document.getElementById("searchInput").addEventListener("input", function() {
  const q = this.value.trim().toLowerCase();
  filtered = q ? data.filter(c => c.name.toLowerCase().includes(q) || c.series.toLowerCase().includes(q)) : [...data];
  activeId = filtered[0]?.id || null;
  renderSidebar();
  renderMain();
});

filtered = [...data];
renderSidebar();
renderMain();
</script>
