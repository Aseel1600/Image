<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعد البحث عن الصور</title>
  <style>
    :root { --green: #00ff88; --red: #ff4757; --blue: #3742fa; --purple: #a55eea; --bg: #0a0a0a; --card: #1a1a1a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: #fff; padding: 20px; }

    /* HEADER */
    header { text-align: center; padding: 30px 0; }
    header h1 { font-size: 2.5rem; color: var(--green); text-shadow: 0 0 15px rgba(0,255,136,0.3); margin-bottom: 10px; }
    header p { color: #888; font-size: 1rem; margin-bottom: 20px; }

    /* SEARCH */
    .search-box { max-width: 500px; margin: 0 auto 30px auto; position: relative; }
    .search-box input { width: 100%; padding: 15px 20px; border-radius: 50px; border: 2px solid #333; background: #1a1a1a; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
    .search-box input:focus { border-color: var(--green); }
    .search-box .count { color: #555; font-size: 0.85rem; margin-top: 8px; text-align: center; }

    /* NAV TABS */
    .tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
    .tab-btn { padding: 10px 25px; border-radius: 50px; border: 2px solid #333; background: transparent; color: #aaa; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 0.95rem; }
    .tab-btn:hover { border-color: #666; color: white; }
    .tab-btn.active-football { border-color: var(--green); color: var(--green); background: rgba(0,255,136,0.1); }
    .tab-btn.active-anime { border-color: var(--purple); color: var(--purple); background: rgba(165,94,234,0.1); }
    .tab-btn.active-series { border-color: var(--red); color: var(--red); background: rgba(255,71,87,0.1); }
    .tab-btn.active-all { border-color: var(--blue); color: var(--blue); background: rgba(55,66,250,0.1); }

    /* SECTIONS */
    .section { margin-bottom: 50px; }
    .section-title { font-size: 1.8rem; padding: 15px 0; border-bottom: 3px solid; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title .badge { font-size: 0.9rem; padding: 4px 12px; border-radius: 20px; }
    .football-title { border-color: var(--green); color: var(--green); }
    .football-title .badge { background: rgba(0,255,136,0.2); color: var(--green); }
    .anime-title { border-color: var(--purple); color: var(--purple); }
    .anime-title .badge { background: rgba(165,94,234,0.2); color: var(--purple); }
    .series-title { border-color: var(--red); color: var(--red); }
    .series-title .badge { background: rgba(255,71,87,0.2); color: var(--red); }

    /* GRID */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .card { background: var(--card); padding: 18px; border-radius: 10px; cursor: pointer; transition: 0.3s; border: 1px solid #2a2a2a; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
    .card:hover { transform: translateY(-3px); }
    .card .num { font-size: 1.4rem; font-weight: 900; min-width: 35px; text-align: center; }
    .card .name { font-weight: 600; font-size: 0.95rem; }
    .card .search-icon { position: absolute; right: 15px; opacity: 0; transition: 0.3s; font-size: 0.75rem; }
    .card:hover .search-icon { opacity: 1; }

    /* FOOTBALL CARDS */
    .card-football:hover { border-color: var(--green); box-shadow: 0 5px 15px rgba(0,255,136,0.15); }
    .card-football .num { color: var(--green); }
    .card-football .search-icon { color: var(--green); }

    /* ANIME CARDS */
    .card-anime:hover { border-color: var(--purple); box-shadow: 0 5px 15px rgba(165,94,234,0.15); }
    .card-anime .num { color: var(--purple); }
    .card-anime .search-icon { color: var(--purple); }

    /* SERIES CARDS */
    .card-series:hover { border-color: var(--red); box-shadow: 0 5px 15px rgba(255,71,87,0.15); }
    .card-series .num { color: var(--red); }
    .card-series .search-icon { color: var(--red); }

    /* OPEN ALL BUTTON */
    .open-all-btn { padding: 8px 20px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; transition: 0.3s; margin-left: 10px; }
    .open-all-btn:hover { transform: scale(1.05); }
    .open-football { background: var(--green); color: black; }
    .open-anime { background: var(--purple); color: white; }
    .open-series { background: var(--red); color: white; }

    /* BACK TO TOP */
    .back-top { position: fixed; bottom: 30px; left: 30px; background: var(--green); color: black; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5rem; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s; z-index: 999; }
    .back-top:hover { transform: scale(1.1); }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .card { padding: 12px; }
    }
  </style>
</head>
<body>

// Search queries optimized per category
function getSearchQuery(name, category) {
  if (category === 'football') return name + " face portrait photo";
  if (category === 'anime') return name + " anime face close up";
  if (category === 'series') return name + " TV character face portrait";
  return name + " face portrait";
}

function openSearch(name, category) {
  const query = encodeURIComponent(getSearchQuery(name, category));
  window.open("https://www.google.com/search?q=" + query + "&tbm=isch", "_blank");
}

function buildGrid(names, gridId, cardClass, category) {
  const grid = document.getElementById(gridId);
  grid.innerHTML = "";
  names.forEach((name, i) => {
    const card = document.createElement('div');
    card.className = "card " + cardClass;
    card.setAttribute("data-name", name.toLowerCase());
    card.setAttribute("data-category", category);
    card.onclick = () => openSearch(name, category);
    card.innerHTML = `
      <span class="num">${i + 1}</span>
      <span class="name">${name}</span>
      <span class="search-icon">🔍 بحث</span>
    `;
    grid.appendChild(card);
  });
}

buildGrid(seriesCharacters, "seriesGrid", "card-series", "series");

document.getElementById("animeCount").textContent = animeCharacters.length + " شخصية";
document.getElementById("seriesCount").textContent = seriesCharacters.length + " شخصية";

const totalCount = footballPlayers.length + animeCharacters.length + seriesCharacters.length;
document.getElementById("resultCount").textContent = "إجمالي: " + totalCount + " اسم";

// FILTER
function filterCards() {
  const query = document.getElementById("searchInput").value.toLowerCase().trim();
  const allCards = document.querySelectorAll(".card");
  let visible = 0;
  allCards.forEach(card => {
    const name = card.getAttribute("data-name");
    if (name.includes(query)) { card.style.display = "flex"; visible++; }
    else { card.style.display = "none"; }
  });
  document.getElementById("resultCount").textContent = visible + " نتيجة من أصل " + totalCount;
}

// SHOW SECTIONS
function showSection(type) {
  const f = document.getElementById("footballSection");
  const a = document.getElementById("animeSection");
  const s = document.getElementById("seriesSection");
  const tabs = document.querySelectorAll(".tab-btn");

  tabs.forEach(t => t.className = "tab-btn");

  if (type === "all") { f.classList.remove("hidden"); a.classList.remove("hidden"); s.classList.remove("hidden"); tabs[0].classList.add("active-all"); }
  else if (type === "football") { f.classList.remove("hidden"); a.classList.add("hidden"); s.classList.add("hidden"); tabs[1].classList.add("active-football"); }
  else if (type === "anime") { f.classList.add("hidden"); a.classList.remove("hidden"); s.classList.add("hidden"); tabs[2].classList.add("active-anime"); }
  else if (type === "series") { f.classList.add("hidden"); a.classList.add("hidden"); s.classList.remove("hidden"); tabs[3].classList.add("active-series"); }
}

// OPEN ALL IN CATEGORY
function openAllInCategory(category) {
  let list;
  if (category === "football") list = footballPlayers;
  else if (category === "anime") list = animeCharacters;
  else list = seriesCharacters;

  if (confirm("سيتم فتح " + list.length + " تبويب! متأكد؟")) {
    list.forEach((name, i) => {
      setTimeout(() => openSearch(name, category), i * 500);
    });
  }
}
